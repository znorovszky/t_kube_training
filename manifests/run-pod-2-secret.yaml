apiVersion: v1
data:
  .dockerconfigjson: 
kind: Secret
metadata:
  name: docker-pull
type: kubernetes.io/dockerconfigjson
---
# pod.yaml
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: flask-test
  name: flask-test
spec:
  containers:
  - image: znorovszky/flask-test:0.1
    name: flask-test
  imagePullSecrets:
  - name: docker-pull
  dnsPolicy: ClusterFirst
  restartPolicy: Always
---
# service.yaml
apiVersion: v1
kind: Service
metadata:
  labels:
    app: flask-test
  name: flask-svc
  namespace: default
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 5000
  selector:
    app: flask-test
  type: ClusterIP

  # kubectl port-forward service/flask-svc --address=0.0.0.0 80:80  