apiVersion: v1
kind: Pod
metadata:
  labels:
    run: nginx
  name: nginx
spec:
  containers:
  - image: nginx
    name: nginx
    resources: {}
    volumeMounts:
    - name: html-dir
      mountPath: /usr/share/nginx/html
  dnsPolicy: ClusterFirst
  restartPolicy: Always
  initContainers:
  - name: set-html
    image: busybox
    command: ["/bin/sh","-c"]
    args:
    - echo 'This is HTML' > /mnt/index.html
    volumeMounts:
    - name: html-dir
      mountPath: /mnt
  volumes:
  - name: html-dir
    emptyDir:
      sizeLimit: 50Mi
---
# service.yaml
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    run: nginx
  type: ClusterIP

# kubectl port-forward service/nginx-svc --address=0.0.0.0 80:80