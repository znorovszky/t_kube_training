apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-test
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
  # volumeName: pv-test
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: debian
  name: debian
spec:
  containers:
  - command: 
    - sleep
    - infinity
    image: debian
    name: debian
    resources: {}
    volumeMounts:
    - name: mypvc
      mountPath: /data
  volumes:
    - name: mypvc
      persistentVolumeClaim:
        claimName: pvc-test    
  dnsPolicy: ClusterFirst
  restartPolicy: Always