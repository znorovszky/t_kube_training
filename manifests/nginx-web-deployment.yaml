# Nginx deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx-test
  name: nginx
  namespace: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-test
  template:
    metadata:
      labels:
        app: nginx-test
    spec:
      containers:
      - image: nginx
        name: nginx
        resources: {}
        volumeMounts:
        - name: mount-this
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
      - name: mount-this
        configMap:
          name: file-content
          items:
          - key: file-tartalom
            path: index.html
      
# Fájl tartalom a configmap-ben
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: file-content
  namespace: nginx
data:
  file-tartalom: |
    <html>
    <title>Kubernetes training</title>
    <body>Ez configmap-ből jön</body>
    </html>

# Service az Nginx pod-hoz
# service.yaml
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: nginx-test
  name: nginx-svc
  namespace: nginx
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    # A selector a pod valamely, egyértelmű label-jére kell mutasson
    app: nginx-test
  type: ClusterIP
---
# Nodeport service
apiVersion: v1
kind: Service
metadata:
  labels:
    app: nginx-np
  name: nginx-np
spec:
  ports:
  - name: "80"
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: nginx-test
  type: NodePort
status:
  loadBalancer: {}

---
# Network policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: test-network-policy
  namespace: nginx
spec:
  podSelector:
    matchLabels:
      app: nginx-test
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: other


